<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Panels — multi-panel cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <aside class="rail">
    <header class="brand">
      <h1>VICE <span>PANELS</span></h1>
      <p>Your photo, cut into a vice-city poster. Multi-panel cover art, exported as a PNG — all offline.</p>
    </header>

    <section>
      <h2>1 · Photos</h2>
      <div class="slots">
        <button class="slot" type="button"><img alt=""><i>1</i></button>
        <button class="slot" type="button"><img alt=""><i>2</i></button>
        <button class="slot" type="button"><img alt=""><i>3</i></button>
        <button class="slot" type="button"><img alt=""><i>4</i></button>
      </div>
      <label class="fileBtn">Add your photos
        <input id="addPhotos" type="file" accept="image/*" multiple hidden>
      </label>
      <div class="row">
        <button class="mini" type="button" data-sample="pier">Sample: pier</button>
        <button class="mini" type="button" data-sample="boulevard">Sample: boulevard</button>
      </div>
      <p class="hint">Pick a photo, then click a panel to place it. Drag on the cover to slide it.</p>
    </section>

    <section>
      <h2>2 · Panel</h2>
      <label class="slider"><span id="panelName">Panel 1</span> zoom
        <input id="zoom" type="range" min="1" max="2.6" step="0.01" value="1">
      </label>
    </section>

    <section>
      <h2>3 · Layout</h2>
      <div class="btns" id="layoutBtns">
        <button type="button" data-layout="triptych" class="on">Triptych</button>
        <button type="button" data-layout="hero">Hero + Strips</button>
        <button type="button" data-layout="quad">Quad</button>
      </div>
    </section>

    <section>
      <h2>4 · Grade</h2>
      <div class="btns" id="gradeBtns">
        <button type="button" data-grade="sunset">Vice Sunset</button>
        <button type="button" data-grade="neon">Neon Nights</button>
        <button type="button" data-grade="golden">Golden Hour</button>
        <button type="button" data-grade="midnight">Midnight Chrome</button>
        <button type="button" data-grade="emerald" class="on">Emerald Dusk</button>
      </div>
    </section>

    <section>
      <h2>5 · Words &amp; size</h2>
      <label>Caption <input id="caption" type="text" maxlength="26" value="VICE HEAT"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="34" value="ONE LAST SCORE"></label>
      <label>Export size
        <select id="size">
          <option value="1080x1080">1080 × 1080 — square post</option>
          <option value="1080x1350">1080 × 1350 — portrait post</option>
          <option value="1920x1080">1920 × 1080 — wide banner</option>
        </select>
      </label>
    </section>

    <button id="export" type="button">Export PNG</button>
    <p id="status" role="status"></p>
  </aside>
  <section class="stageWrap">
    <canvas id="stage" width="740" height="740" aria-label="Live cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
